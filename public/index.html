<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DamiWatch</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-icon">▶</span>
        <div>
          <div class="brand-title">DamiWatch</div>
          <div class="brand-subtitle">Watch together live</div>
        </div>
      </div>
      <div class="topbar-actions">
        <button id="watchTogetherBtn" class="cta-box">WATCH TOGETHER</button>
        <a id="authBtn" href="/login" class="secondary-btn">Login</a>
      </div>
    </header>

    <main>
      <section id="home-screen" class="screen active">
        <div class="hero-grid">
          <div class="hero-copy">
            <div class="eyebrow">Keep your friends in sync</div>
            <h1>DamiWatch</h1>
            <button id="browseAnimeBtn" class="primary-btn">Browse anime</button>
          </div>
          <div class="hero-card">
            <div class="hero-card-label">DamiWatch</div>
            <button id="heroBrowseCardBtn" class="secondary-btn">Browse anime</button>
            <div class="card" style="margin-top:16px;">
              <div id="playlist-card-title" class="card-title">default (0)</div>
              <div id="playlists-home"></div>
              <div style="display:flex;gap:8px;margin-top:12px;">
                <input id="newPlaylistName" type="text" placeholder="Add the anime title" style="flex:1;padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:var(--text);" />
                <button id="createPlaylistBtn" class="secondary-btn">Create</button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section id="browse-screen" class="screen">
        <div class="watch-header">
          <div>
            <div class="eyebrow">Anime Library</div>
            <h2>All anime playlists</h2>
            <p>Select a playlist to begin watching.</p>
          </div>
          <div style="display:flex;gap:8px;align-items:center;">
            <button id="browseHomeBtn" class="secondary-btn">Home</button>
          </div>
        </div>
        <div class="card" style="margin-top:20px;">
          <div id="browse-playlists-list"></div>
        </div>
      </section>

      <section id="watch-screen" class="screen">
        <div class="watch-header">
          <div>
            <div class="eyebrow">Live Room</div>
            <h2>Watch Together</h2>
            <p>Control playback, share a URL, or upload a video right from this page.</p>
          </div>
          <div style="display:flex;gap:8px;align-items:center;">
            <button id="backHomeBtn" class="secondary-btn">Home</button>
            <button id="openUploadBtn" class="secondary-btn">Upload / URL</button>
          </div>
        </div>

        <div id="upload-panel" class="card hidden">
          <div class="upload-row">
            <div class="upload-field">
              <label>Upload a video file</label>
              <input id="videoFile" type="file" accept="video/*" />
            </div>
            <div class="upload-field">
              <label>Or paste a video URL</label>
              <input id="videoUrl" type="url" placeholder="https://example.com/video.mp4" />
            </div>
          </div>
          <div class="upload-actions">
            <button id="addUrlBtn" class="primary-btn">Load Video URL</button>
            <button id="uploadBtn" class="secondary-btn">Upload File</button>
            <div style="display:flex;gap:8px;align-items:center;">
              <select id="playlistSelect" style="padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:var(--text);"></select>
              <button id="addToPlaylistBtn" class="secondary-btn">Add Upload to Playlist</button>
              <button id="addUrlToPlaylistBtn" class="secondary-btn">Add URL to Playlist</button>
            </div>
            <div id="uploadStatus" class="status-text"></div>
          </div>
        </div>

        <div class="watch-grid">
          <div class="video-panel">
            <video id="video" controls crossorigin="anonymous"></video>
            <div id="role-select" class="role-select">
              <label><input type="radio" name="role" value="viewer" checked> Viewer</label>
              <label><input type="radio" name="role" value="uploader"> Uploader</label>
            </div>
          </div>

          <aside class="sidebar">
            <div class="card playlist-card">
              <div class="card-title">Playlist</div>
              <div id="playlist"></div>
            </div>
          </aside>
        </div>
      </section>
    </main>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/client.js"></script>
  <script>
    (async () => {
      const authBtn = document.getElementById('authBtn');
      if (!authBtn) return;
      try {
        const response = await fetch('/api/auth/me', { credentials: 'same-origin' });
        const data = await response.json();
        if (data.user) {
          authBtn.textContent = 'Logout';
          authBtn.href = '/logout';
          authBtn.title = data.user.email;
        }
      } catch (error) {
        // ignore auth check failures and keep the login link
      }
    })();
  </script>
</body>
</html>
